# Le istruzioni per GitHub Actions: "scarica i prezzi, controlla gli allarmi
# e PUBBLICA il sito con i prezzi già dentro".
#
# Differenza con prima: i prezzi NON vengono più salvati nel repository.
# Finiscono solo nel sito pubblicato, quindi la cronologia del codice resta pulita
# (niente più salvataggi "Aggiorna prezzi").
#
# Dove restano i dati tra un giro e l'altro? Nel sito stesso: a ogni giro il programma
# scarica i file dei dati dal sito già pubblicato, aggiunge i nuovi prezzi e ripubblica.

name: Aggiorna prezzi e pubblica sito

on:
  schedule:
    # Lunedì-venerdì, ai minuti 7 e 37 di ogni ora dalle 7 alle 20 (ora UTC).
    # In Italia sono le 8-21 d'inverno e le 9-22 d'estate.
    - cron: "7,37 7-20 * * 1-5"
    # Due volte al giorno lavorano anche gli "agenti" (fondamentali, analisi tecnica, occasioni, rischi):
    #  - 11:53 UTC: in Italia sono le 12:53 d'inverno e le 13:53 d'estate (pronto per quando esci da scuola)
    #  - 21:23 UTC: la sera, dopo la chiusura di Wall Street
    - cron: "53 11 * * 1-5"
    - cron: "23 21 * * 1-5"
  push:
    branches: [main]   # quando unisci una modifica al codice, il sito si aggiorna subito
  workflow_dispatch:   # il pulsante "Run workflow" per farlo partire a mano
    inputs:
      prova_notifica:
        description: "Manda anche una notifica di prova ntfy (i prezzi si aggiornano comunque)"
        type: boolean
        default: false
      agenti:
        description: "Fai lavorare subito anche gli agenti, senza aspettare il prossimo giro"
        type: boolean
        default: false

permissions:
  contents: read    # legge il codice, ma NON può più scrivere nel repository
  pages: write      # può pubblicare il sito
  id-token: write   # serve a GitHub per verificare chi sta pubblicando

concurrency:
  group: pubblica-sito   # mai due pubblicazioni nello stesso momento
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v5

      - name: Prepara la pubblicazione (e scopri l'indirizzo del sito)
        id: pages
        uses: actions/configure-pages@v5

      - name: Recupera i dati già pubblicati (prezzi, storico, allarmi, notizie, analisi)
        env:
          SITO: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p data
          for nome in prezzi storico intraday allarmi notizie analisi serie ai; do
            # "?t=..." evita di ricevere una copia vecchia dalla memoria di GitHub
            if curl -fsSL "$SITO/data/$nome.json?t=$(date +%s)" -o "/tmp/$nome.json" \
               && python3 -c "import json, sys; json.load(open(sys.argv[1]))" "/tmp/$nome.json" 2>/dev/null; then
              mv "/tmp/$nome.json" "data/$nome.json"
              echo "Recuperato $nome.json dal sito"
            else
              echo "Nessun $nome.json sul sito: si parte da zero"
            fi
          done
          # I grafici dei titoli (un file per titolo, data/grafici/) viaggiano in un unico pacchetto
          if curl -fsSL "$SITO/data/grafici.tar.gz?t=$(date +%s)" -o /tmp/grafici.tar.gz \
             && tar -tzf /tmp/grafici.tar.gz > /dev/null 2>&1; then
            mkdir -p data/grafici
            tar -xzf /tmp/grafici.tar.gz -C data/grafici --no-same-owner --wildcards '*.json'
            echo "Recuperati $(ls data/grafici | wc -l) grafici dal sito"
          else
            echo "Nessun grafici.tar.gz sul sito: li preparano gli agenti al prossimo giro"
          fi

      - name: Scarica prezzi e notizie, controlla gli allarmi
        # Se Yahoo un giorno non risponde, pubblichiamo comunque il sito con gli ultimi dati
        continue-on-error: true
        run: python3 scripts/aggiorna_prezzi.py
        env:
          # Il nome segreto del canale ntfy: sta nella "cassaforte" di GitHub, non nel codice
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROVA_NOTIFICA: ${{ inputs.prova_notifica }}

      - name: Fai lavorare gli agenti (due volte al giorno)
        # Se una fonte non risponde, il sito esce comunque con le analisi del giorno prima
        continue-on-error: true
        timeout-minutes: 25
        env:
          GIRO_SERALE: ${{ github.event.schedule == '53 11 * * 1-5' || github.event.schedule == '23 21 * * 1-5' || inputs.agenti == true }}
          # La chiave gratuita di Finnhub, da cui arrivano i conti delle aziende: sta nei Secrets, non nel codice
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # L'avvocato del diavolo con AI è SPENTO finché non crei il segreto ANTHROPIC_API_KEY.
          # I tre freni alla spesa sono "Variables" (non segreti): se non le crei valgono i valori predefiniti.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODELLO: ${{ vars.AI_MODELLO }}
          AI_CHIAMATE_AL_GIORNO: ${{ vars.AI_CHIAMATE_AL_GIORNO }}
          AI_BUDGET_MENSILE_USD: ${{ vars.AI_BUDGET_MENSILE_USD }}
        run: |
          # La libreria di Anthropic serve solo se l'AI è accesa
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install --quiet "anthropic>=2.8,<3"
          fi
          if [ "$GIRO_SERALE" = "true" ]; then
            python3 scripts/aggiorna_analisi.py
          else
            # Negli altri giri (ogni 30 minuti) gli agenti lavorano solo se l'analisi manca
            # o è vecchia: così non si sprecano minuti di GitHub Actions
            python3 scripts/aggiorna_analisi.py --se-vecchia
          fi

      - name: Controlla che ci siano i prezzi
        run: |
          # Se mancano sia i dati del sito sia quelli di Yahoo, ci fermiamo:
          # meglio lasciare online il sito di prima che pubblicarne uno senza prezzi
          if [ ! -s data/prezzi.json ]; then
            echo "::error::Nessun prezzo disponibile: il sito NON viene ripubblicato."
            exit 1
          fi

      - name: Metti insieme i file del sito
        run: |
          # Solo ciò che serve alla pagina: niente programmi, niente README
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r agenti _site/agenti
          cp -r icone _site/icone           # le icone per la schermata Home
          cp manifest.webmanifest _site/    # nome e icone della dashboard per Android
          cp -r librerie _site/librerie   # la libreria dei grafici (Lightweight Charts)
          cp -r data _site/data
          # I grafici dei titoli anche in un unico pacchetto: serve solo al prossimo giro per recuperarli
          if ls data/grafici/*.json > /dev/null 2>&1; then
            (cd data/grafici && tar -czf ../../_site/data/grafici.tar.gz *.json)
          fi
          # Aggiungi ai file di stile e di codice un "numero di versione" (il codice
          # dell'ultima modifica): così, quando il sito cambia, il browser scarica
          # i file nuovi invece di mostrare quelli vecchi che ha in memoria.
          # Il numero cambia solo quando cambia il codice, non a ogni prezzo.
          versione="${GITHUB_SHA::8}"
          sed -i -E "s#(href=\"style\.css|src=\"(agenti/[a-z]+|app)\.js)\"#\1?v=${versione}\"#g" _site/index.html

      - name: Impacchetta il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica il sito
        id: pubblicazione
        uses: actions/deploy-pages@v4
